name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Supabase env vars
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY_SECRET: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL="${VITE_SUPABASE_URL:-$VITE_SUPABASE_URL_SECRET}"
          SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY:-$VITE_SUPABASE_ANON_KEY_SECRET}"

          test -n "$SUPABASE_URL" || (echo "Missing Actions variable/secret: VITE_SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing Actions variable/secret: VITE_SUPABASE_ANON_KEY" && exit 1)

          echo "::add-mask::$SUPABASE_ANON_KEY"
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"

      - name: Ping Auth health endpoint
        run: |
          STATUS=$(curl -sS -o /tmp/auth-health.txt -w "%{http_code}" --max-time 20 "$SUPABASE_URL/auth/v1/health")
          echo "auth/v1/health -> HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            cat /tmp/auth-health.txt
            exit 1
          fi

      - name: Ping REST endpoint
        run: |
          STATUS=$(curl -sS -o /tmp/rest-ping.txt -w "%{http_code}" --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/apartments?select=id&limit=1")

          echo "rest/v1/apartments -> HTTP $STATUS"
          case "$STATUS" in
            200|204|401|403)
              echo "Supabase endpoint reachable."
              ;;
            *)
              cat /tmp/rest-ping.txt
              exit 1
              ;;
          esac
