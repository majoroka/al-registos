name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Supabase env vars
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY_SECRET: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL="${VITE_SUPABASE_URL:-$VITE_SUPABASE_URL_SECRET}"
          SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY:-$VITE_SUPABASE_ANON_KEY_SECRET}"

          test -n "$SUPABASE_URL" || (echo "Missing Actions variable/secret: VITE_SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing Actions variable/secret: VITE_SUPABASE_ANON_KEY" && exit 1)

          echo "::add-mask::$SUPABASE_ANON_KEY"
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"

      - name: Ping Auth health endpoint
        run: |
          STATUS=$(curl -sS -o /tmp/auth-health.txt -w "%{http_code}" --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health")
          echo "auth/v1/health -> HTTP $STATUS"
          case "$STATUS" in
            200|204|401|403)
              echo "Auth endpoint reachable."
              ;;
            *)
              cat /tmp/auth-health.txt
              exit 1
              ;;
          esac

      - name: Ping REST endpoint
        run: |
          STATUS=$(curl -sS -o /tmp/rest-ping.txt -w "%{http_code}" --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/apartments?select=id&limit=1")

          echo "rest/v1/apartments -> HTTP $STATUS"
          case "$STATUS" in
            200|204|401|403)
              echo "Supabase endpoint reachable."
              ;;
            *)
              cat /tmp/rest-ping.txt
              exit 1
              ;;
          esac

  notify_failure:
    needs: ping
    if: ${{ always() && needs.ping.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update keep-alive alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const title = '[ALERTA] Supabase keep-alive falhou'
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const timestamp = new Date().toISOString()
            const label = 'supabase-keepalive-alert'

            const { data: labels } = await github.rest.issues.listLabelsForRepo({
              owner,
              repo,
              per_page: 100,
            })
            const hasLabel = labels.some((item) => item.name === label)

            if (!hasLabel) {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'd73a4a',
                description: 'Alertas automáticos do workflow Supabase Keep Alive',
              })
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100,
            })

            const existing = openIssues.find((issue) => issue.title === title)
            const commentBody =
              `Falha detetada no workflow de keep-alive.\n\n` +
              `- Data (UTC): ${timestamp}\n` +
              `- Workflow run: ${runUrl}\n` +
              `- Ação recomendada: verificar logs e testar manualmente o workflow.`

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: commentBody,
              })
              core.info(`Issue existente atualizada: #${existing.number}`)
            } else {
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: commentBody,
                labels: [label],
              })
              core.info(`Issue criada: #${created.number}`)
            }
